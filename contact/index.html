<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body{margin:0;min-height:100vh;font-family:Onest,system-ui,sans-serif;color:#E2E8FF;
      background:linear-gradient(180deg,#100e2b,#090819);display:flex;align-items:center;justify-content:center;}
    .card{max-width:28rem;width:90%;padding:2rem;border:1px solid rgba(255,255,255,.12);border-radius:1rem;
      background:rgba(12,16,46,.5);}
    a{color:#a78bfa}
    h1{margin:0 0 .75rem;font-size:1.75rem}
    p{margin:0;color:#A5B0D6;line-height:1.5}
  </style>

<style id="site-scrollbar">
  html {
    scrollbar-width: thin;
    scrollbar-color: #8B5CF6 #1a1535;
  }
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: #1a1535;
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #A78BFA, #7C3AED);
    border-radius: 8px;
    border: 2px solid #1a1535;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #C4B5FD, #8B5CF6);
  }
  ::-webkit-scrollbar-corner {
    background: #1a1535;
  }
</style>

<link rel="icon" href="/favicon.ico?v=saturn1" sizes="any"/>
<link rel="icon" type="image/png" href="/favicon-16x16.png?v=saturn1" sizes="16x16"/>
<link rel="icon" type="image/png" href="/favicon-32x32.png?v=saturn1" sizes="32x32"/>
<link rel="icon" type="image/png" href="/favicon-96x96.png?v=saturn1" sizes="96x96"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=saturn1" sizes="180x180"/>
<link rel="shortcut icon" href="/favicon.ico?v=saturn1"/>

<style id="site-nav-match">
  .top {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: .85rem 1.25rem;
    background: #090819;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .top .brand {
    display: flex; align-items: center; gap: .75rem;
    text-decoration: none;
  }
  .top .brand img {
    display: block; width: 40px; height: 40px;
    background: transparent; object-fit: contain;
  }
  .top nav {
    display: flex; align-items: center; gap: 1.75rem;
    font-size: .9rem; font-weight: 600;
  }
  .top nav a {
    color: #ABB0C7; text-decoration: none; transition: color .15s ease;
  }
  .top nav a:hover, .top nav a.active { color: #fff; }
  .top .nav-cta {
    display: inline-flex; align-items: center; justify-content: center;
    padding: .5rem 1rem; border-radius: 999px;
    background: linear-gradient(90deg, #6739FF, #6E52C3);
    color: #fff !important; font-weight: 700; font-size: .85rem;
  }
  .top .nav-cta:hover { filter: brightness(1.08); color: #fff !important; }
  @media (max-width: 720px) {
    .top nav a.nav-hide-sm { display: none; }
    .top nav { gap: .85rem; }
  }
</style>
<link rel="canonical" href="https://getyourcheats.com/contact/"/>
<meta name="robots" content="noindex, follow"/>
<meta property="og:url" content="https://getyourcheats.com/contact/"/>
</head>
<body>

  <header class="top">
    <a class="brand" href="/" aria-label="Home">
      <img src="/images/logo-48.png?v=7" alt="Logo" width="40" height="40"/>
    </a>
    <nav>
      <a href="/">Home</a>
      <a class="nav-hide-sm" href="/support">Support</a>
      <a class="nav-hide-sm" href="/signin">Sign In</a>
      <a class="nav-cta" href="/contact">Contact</a>
    </nav>
  </header>

  <div class="card">
    <h1>Contact</h1>
    <p>Get in touch with us. You can also go back to the <a href="/">home page</a>.</p>
  </div>
</body>
</html>
